<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Quantum Neural Interface v3.0</title>
    <style>
        :root {
            --neon-cyan: #64ffda;
            --neon-green: #00ff88;
            --neon-red: #ff6b6b;
            --bg-dark: #0a192f;
            --panel-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #112240 0%, #0a192f 100%);
            color: #e0e6ed;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            grid-template-rows: 70px 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* Glassmorphism Panels */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .logo-group { display: flex; align-items: center; gap: 15px; }
        
        .quantum-pulse {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Visualization Area */
        #quantum-canvas {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin: 10px 0;
        }

        /* Metrics Styling */
        .metric-card {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--neon-cyan);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .progress-container {
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-top: 8px;
            border-radius: 2px;
        }

        .progress-bar {
            height: 100%;
            background: var(--neon-cyan);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Editor */
        .editor-container { flex-grow: 1; display: flex; flex-direction: column; }
        
        #code-editor {
            flex-grow: 1;
            background: rgba(0,0,0,0.4);
            color: #8892b0;
            font-family: 'Fira Code', 'Courier New', monospace;
            padding: 15px;
            border: none;
            resize: none;
            outline: none;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Controls */
        .control-group { margin-bottom: 20px; }
        label { font-size: 0.75rem; color: #8892b0; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-cyan);
            margin: 8px 0;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .log {
            font-family: monospace;
            font-size: 11px;
            height: 120px;
            overflow-y: auto;
            color: #8892b0;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 4px;
        }

        .log-info { color: var(--neon-cyan); }
        .log-warn { color: #feca57; }
    </style>
</head>
<body>

<div class="container">
    <header class="panel header">
        <div class="logo-group">
            <div class="quantum-pulse"></div>
            <h2>BIO-QUANTUM v3.0</h2>
        </div>
        <div style="display: flex; gap: 30px; font-size: 12px;">
            <div>SYNC: <span id="sync-val" style="color:var(--neon-green)">94.2%</span></div>
            <div>COHERENCE: <span id="coh-val" style="color:var(--neon-cyan)">--</span></div>
            <div>STATUS: <span style="color:var(--neon-green)">STABLE</span></div>
        </div>
    </header>

    <aside class="panel">
        <h4 style="color:var(--neon-cyan); margin-bottom: 15px;">NEURAL TOPOLOGY</h4>
        <canvas id="quantum-canvas"></canvas>
        
        <div id="metrics-area">
            <div class="metric-card">
                <div style="display:flex; justify-content:space-between">
                    <span>Neuroplasticity</span>
                    <span id="v-plasticity">72%</span>
                </div>
                <div class="progress-container"><div id="b-plasticity" class="progress-bar"></div></div>
            </div>
            <div class="metric-card" style="border-left-color: var(--neon-green);">
                <div style="display:flex; justify-content:space-between">
                    <span>Mitochondrial Efficiency</span>
                    <span id="v-mito">88%</span>
                </div>
                <div class="progress-container"><div id="b-mito" class="progress-bar" style="background:var(--neon-green)"></div></div>
            </div>
        </div>

        <div class="log" id="sys-log"></div>
    </aside>

    <main class="panel editor-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size: 12px; color: var(--neon-cyan);">SRC: OPTIMIZATION_KERNEL.PY</span>
            <button class="btn" style="width: auto; padding: 5px 15px;" onclick="runKernel()">Execute Kernel</button>
        </div>
        <textarea id="code-editor"></textarea>
    </main>

    <aside class="panel">
        <h4 style="color:var(--neon-cyan); margin-bottom: 15px;">FIELD CONTROLS</h4>
        
        <div class="control-group">
            <label>Waveform Frequency (Hz)</label>
            <input type="range" id="freq-slider" min="1" max="60" value="24">
            <div id="freq-display" style="text-align:right; font-size:12px">24 Hz</div>
        </div>

        <div class="control-group">
            <label>Entanglement Intensity</label>
            <input type="range" id="entangle-slider" min="0" max="100" value="65">
        </div>

        <div class="control-group">
            <label>Field Resonance</label>
            <input type="range" id="res-slider" min="0" max="100" value="40">
        </div>

        <button class="btn" onclick="triggerScan()">Full Bio-Scan</button>
        <button class="btn" onclick="saveState()">Save Configuration</button>
        <button class="btn" style="border-color: var(--neon-red); color: var(--neon-red);" onclick="resetSystem()">Emergency Reset</button>
        
        <div style="margin-top: 20px; font-size: 10px; color: #495670;">
            <p>QUANTUM MODEL: ORCH-OR</p>
            <p>$\hat{H} \psi = (i \hbar) \frac{\partial \psi}{\partial t}$</p>
        </div>
    </aside>
</div>

<script>
    // --- Initial Configuration & State ---
    const defaultCode = `# Bio-Quantum Kernel v3.0
def quantum_sync():
    field = QuantumField(frequency=24.0)
    field.engage_observer_protection()
    
    while True:
        coherence = field.measure_microtubules()
        if coherence < 0.8:
            field.inject_stabilizer(0.15)
        update_neural_plasticity()`;

    let state = JSON.parse(localStorage.getItem('bq_state')) || {
        freq: 24,
        entangle: 65,
        res: 40,
        code: defaultCode
    };

    // --- DOM Elements ---
    const canvas = document.getElementById('quantum-canvas');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('sys-log');
    const editor = document.getElementById('code-editor');

    // --- Initialize ---
    window.onload = () => {
        editor.value = state.code;
        document.getElementById('freq-slider').value = state.freq;
        document.getElementById('entangle-slider').value = state.entangle;
        document.getElementById('res-slider').value = state.res;
        
        addLog("System initialized. Welcome, Observer.");
        requestAnimationFrame(drawWave);
        updateLoop();
    };

    // --- Persistent Storage ---
    function saveState() {
        state.code = editor.value;
        localStorage.setItem('bq_state', JSON.stringify(state));
        addLog("Configuration saved to local core.", "info");
    }

    function addLog(msg, type="default") {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const color = type === "info" ? 'var(--neon-cyan)' : 'inherit';
        logEl.innerHTML += `<div>[${time}] <span style="color:${color}">${msg}</span></div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    // --- Canvas Logic (Real-time Quantum Wave) ---
    let offset = 0;
    function drawWave() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const freq = document.getElementById('freq-slider').value;
        const amplitude = document.getElementById('entangle-slider').value / 4;
        
        ctx.beginPath();
        ctx.strokeStyle = '#64ffda';
        ctx.lineWidth = 2;

        for (let x = 0; x < canvas.width; x++) {
            // Complex wave interference pattern
            const y = canvas.height/2 + 
                      Math.sin(x * 0.05 + offset) * amplitude + 
                      Math.sin(x * 0.02 + offset * 0.5) * (amplitude/2);
            
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        
        ctx.stroke();
        
        // Secondary "Ghost" wave (Quantum superposition)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
        for (let x = 0; x < canvas.width; x++) {
            const y = canvas.height/2 + Math.cos(x * 0.03 + offset) * (amplitude * 0.8);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        offset += (freq / 100);
        requestAnimationFrame(drawWave);
    }

    // --- UI Update Loop ---
    function updateLoop() {
        const freq = document.getElementById('freq-slider').value;
        const coh = (90 + Math.random() * 9).toFixed(1);
        
        document.getElementById('freq-display').innerText = `${freq} Hz`;
        document.getElementById('coh-val').innerText = `${coh}%`;
        
        // Randomize metrics slightly for "live" feel
        const plas = 70 + Math.random() * 10;
        document.getElementById('v-plasticity').innerText = `${plas.toFixed(0)}%`;
        document.getElementById('b-plasticity').style.width = `${plas}%`;
        
        setTimeout(updateLoop, 2000);
    }

    function triggerScan() {
        addLog("Initiating bio-scan...", "info");
        let i = 0;
        const interval = setInterval(() => {
            addLog(`Scanning Layer ${i+1}... Complete.`);
            if (i++ > 3) {
                clearInterval(interval);
                addLog("Bio-scan finished. No decoherence detected.", "info");
            }
        }, 800);
    }

    function runKernel() {
        addLog("Compiling kernel...", "info");
        setTimeout(() => addLog("Kernel Active. Neural pathways optimized."), 1200);
    }

    function resetSystem() {
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
